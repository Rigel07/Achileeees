name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Si el repo contiene el .zip sin descomprimir, lo abre; si no, usa la raíz del repo.
      - name: Preparar proyecto
        id: prep
        run: |
          if ls *.zip >/dev/null 2>&1; then
            mkdir -p mod
            unzip -q -o "$(ls *.zip | head -n1)" -d mod
            echo "dir=mod" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Compilar
        working-directory: ${{ steps.prep.outputs.dir }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: achilles-jar
          path: ${{ steps.prep.outputs.dir }}/build/libs/*.jar
